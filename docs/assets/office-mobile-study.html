<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThemeTeam - VIS-04 Mobile Design Study, Not Runtime</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e2e9e6;color:#263b32;font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}button{font:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid #aabcb1;border-radius:4px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:focus-visible{outline:3px solid #a12c55;outline-offset:2px}button:hover{background:#e9f2eb}.app{position:relative;max-width:480px;height:100vh;height:100dvh;min-height:600px;margin:auto;background:#f7faf8;display:grid;grid-template-rows:52px 48px minmax(0,1fr) 60px;overflow:hidden}.top,.toolbar,.bottom{display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;background:#f7faf8;z-index:1}.top{border-bottom:1px solid #bdccc3}.top strong{font-size:19px}.badge{font-size:12px;color:#526659}.toolbar{font-size:13px;border-bottom:1px solid #bdccc3}.status{display:flex;gap:6px;align-items:center}.dot{width:7px;height:7px;background:#247940;border-radius:50%}.scene{position:relative;overflow:hidden;background:#a2c5b6}.plane{position:absolute;top:0;left:50%;transform:translateX(-50%)}.plane img{width:100%;height:100%;display:block}.person{position:absolute;left:43%;top:25%;width:14%;height:20%;border:0;background:transparent;border-radius:0}.person:hover{background:#ffffff18}.bottom{border-top:1px solid #bdccc3}.primary{background:#176b49;color:#fff;border-color:#176b49;padding:0 14px}.primary:hover{background:#115738}.drawer{position:absolute;z-index:2;bottom:60px;left:0;right:0;max-height:360px;height:360px;background:#f7faf8;border-top:1px solid #879f91;display:flex;flex-direction:column}.drawer[hidden]{display:none}.drawer-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid #d1ddd5;padding:8px 12px;flex-shrink:0}.drawer-head strong{flex:1;min-width:0}.icon{width:44px;flex:0 0 44px;background:transparent;border:0}.drawer-body{padding:14px 18px;overflow:auto;overscroll-behavior:contain;min-height:0}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:16px 0 8px}p{margin:0 0 12px}.id{font-size:12px;color:#526659;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:84px 1fr;gap:7px;margin:12px 0}dt{color:#526659}dd{margin:0;overflow-wrap:anywhere}.record{width:100%;justify-content:space-between;text-align:left;padding:10px;min-height:48px;overflow-wrap:anywhere}.record span{min-width:0}.record svg{flex-shrink:0}[hidden]{display:none!important}h1,h2,p,strong{overflow-wrap:anywhere}
.drawer{height:min(360px,calc((100dvh - 160px)*.5))}
.drawer-body{padding:10px 18px}.drawer-body h2{margin:10px 0 6px}.drawer-body dl{gap:4px;margin:8px 0}.drawer-body .id{margin-bottom:8px}
</style>
</head>
<body>
<div class="app" aria-label="VIS-04 布局样机">
  <header class="top"><strong>ThemeTeam</strong><span class="badge">VIS-04 / 设计样机</span></header>
  <div class="toolbar"><span>办公室</span><span class="status"><span class="dot"></span>演示场景 / 模型未连接</span></div>
  <main class="scene" aria-label="办公室位图设计参考">
    <div class="plane"><img src="../../output/imagegen/vis04-mobile-scene-v1.png" alt="选中绿衣 Dev，周围是等轴测工位、门洞与走廊"><button class="person" aria-label="查看 Dev" title="查看 Dev" aria-controls="details" aria-expanded="false"></button></div>
  </main>
  <footer class="bottom"><span class="status"><span class="dot"></span>Dev 已选中</span><button class="primary" id="open" aria-controls="details" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>成员详情</button></footer>
  <aside id="details" class="drawer" aria-label="选中对象详情" hidden>
    <div class="drawer-head"><button class="icon" id="back" title="返回 Dev" aria-label="返回 Dev" hidden><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></button><strong id="heading">成员详情</strong><button class="icon" id="close" title="关闭详情" aria-label="关闭详情"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
    <div class="drawer-body">
      <section id="agent"><h1>Dev</h1><p class="id">agent-demo-developer</p><dl><dt>角色</dt><dd>Developer</dd><dt>场景状态</dt><dd>待命（演示）</dd><dt>模型</dt><dd>未连接</dd></dl><h2>关联任务</h2><button class="record" id="task-open"><span>实现办公室画布与周边模块交互</span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></section>
      <section id="task" hidden><h1>实现办公室画布与周边模块交互</h1><p class="id">task-demo-office-canvas-selection-and-context-restoration</p><dl><dt>负责人</dt><dd>Dev</dd><dt>任务状态</dt><dd>待办</dd></dl><p>人物选中、详情与任务关联。</p></section>
    </div>
  </aside>
</div>
<!-- Icons: lucide-react 1.43.0, ISC; exported from the installed library. See frontend/node_modules/lucide-react/LICENSE. -->
<script>
const scene=document.querySelector('.scene'),plane=document.querySelector('.plane'),drawer=document.querySelector('.drawer');
const openButton=document.querySelector('#open'),person=document.querySelector('.person'),closeButton=document.querySelector('#close'),backButton=document.querySelector('#back'),taskButton=document.querySelector('#task-open');
let invoker=openButton;
function fit(){const size=Math.max(scene.clientWidth,scene.clientHeight);plane.style.width=`${size}px`;plane.style.height=`${size}px`}
const resize=new ResizeObserver(fit);resize.observe(scene);fit();
function showTask(active){document.querySelector('#agent').hidden=active;document.querySelector('#task').hidden=!active;backButton.hidden=!active;document.querySelector('#heading').textContent=active?'任务详情':'成员详情';document.querySelector('.drawer-body').scrollTop=0}
function openDetails(button){invoker=button;showTask(false);drawer.hidden=false;openButton.setAttribute('aria-expanded','true');person.setAttribute('aria-expanded','true');closeButton.focus()}
function closeDetails(){drawer.hidden=true;openButton.setAttribute('aria-expanded','false');person.setAttribute('aria-expanded','false');invoker.focus()}
openButton.addEventListener('click',()=>openDetails(openButton));person.addEventListener('click',()=>openDetails(person));closeButton.addEventListener('click',closeDetails);
taskButton.addEventListener('click',()=>{showTask(true);backButton.focus()});backButton.addEventListener('click',()=>{showTask(false);taskButton.focus()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!drawer.hidden){event.preventDefault();closeDetails()}});
window.addEventListener('pagehide',()=>resize.disconnect(),{once:true});
</script>
</body></html>
